<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_title }}</title>
  <style>
    :root { color-scheme: light; --bg:#f5f7fb; --card:#fff; --text:#111827; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; --danger:#dc2626; --success:#16a34a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:20px; }
    .container { width:min(100%,720px); background:var(--card); border-radius:16px; padding:24px; box-shadow:0 8px 24px rgba(0,0,0,0.08); }
    form { display:flex; gap:8px; margin:16px 0; }
    input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:10px; }
    button { border:none; border-radius:10px; padding:10px 12px; cursor:pointer; }
    .add-btn { background:var(--accent); color:white; }
    .filters { display:flex; gap:8px; margin-bottom:12px; }
    .filter-btn.active { background:var(--accent); color:white; }
    .filter-btn { background:#eff6ff; color:var(--accent); }
    .message { min-height:22px; color:var(--danger); margin-bottom:12px; }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); }
    .todo-left { display:flex; align-items:center; gap:10px; }
    .completed { text-decoration:line-through; color:#9ca3af; }
    .actions { display:flex; gap:8px; }
    .toggle-btn { background:var(--success); color:white; }
    .delete-btn { background:var(--danger); color:white; }
    .empty { color:var(--muted); padding:12px 0; }
    @media (max-width:480px) { body{padding:10px;} .container{padding:16px;} form{flex-direction:column;} }
  </style>
</head>
<body>
  <div class="container">
    <h1>{{ app_title }}</h1>
    <div id="message" class="message"></div>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요" />
      <button class="add-btn" type="submit">추가</button>
    </form>
    <div class="filters">
      <button class="filter-btn active" data-filter="all" type="button">전체</button>
      <button class="filter-btn" data-filter="active" type="button">진행중</button>
      <button class="filter-btn" data-filter="completed" type="button">완료</button>
    </div>
    <div id="todo-count">남은 할 일 0개</div>
    <ul id="todo-list"></ul>
  </div>
  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const message = document.getElementById('message');
    const count = document.getElementById('todo-count');
    const filters = Array.from(document.querySelectorAll('.filter-btn'));
    let todos = [];
    let currentFilter = 'all';

    async function loadTodos() {
      const response = await fetch(`/api/todos?status=${currentFilter}`);
      todos = await response.json();
      render();
    }

    function render() {
      const remaining = todos.filter(todo => !todo.completed).length;
      count.textContent = `남은 할 일 ${remaining}개`;
      if (!todos.length) {
        list.innerHTML = '<li class="empty">할 일이 없습니다. 새 할 일을 추가해 보세요.</li>';
        return;
      }
      list.innerHTML = todos.map(todo => `
        <li>
          <div class="todo-left">
            <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${todo.id})" />
            <span class="${todo.completed ? 'completed' : ''}">${todo.title}</span>
          </div>
          <div class="actions">
            <button class="toggle-btn" type="button" onclick="toggleTodo(${todo.id})">${todo.completed ? '복원' : '완료'}</button>
            <button class="delete-btn" type="button" onclick="deleteTodo(${todo.id})">삭제</button>
          </div>
        </li>
      `).join('');
    }

    async function addTodo() {
      const title = input.value.trim();
      if (!title) {
        message.textContent = '할 일을 입력해 주세요.';
        return;
      }
      const response = await fetch('/api/todos', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title})});
      if (response.ok) {
        input.value='';
        message.textContent='';
        await loadTodos();
      }
    }

    async function toggleTodo(id) {
      const todo = todos.find(item => item.id === id);
      if (!todo) return;
      await fetch(`/api/todos/${id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({completed: !todo.completed})});
      await loadTodos();
    }

    async function deleteTodo(id) {
      if (!window.confirm('정말 삭제하시겠어요?')) return;
      await fetch(`/api/todos/${id}`, {method:'DELETE'});
      await loadTodos();
    }

    filters.forEach(button => {
      button.addEventListener('click', async () => {
        currentFilter = button.dataset.filter;
        filters.forEach(btn => btn.classList.toggle('active', btn === button));
        await loadTodos();
      });
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      await addTodo();
    });

    window.toggleTodo = toggleTodo;
    window.deleteTodo = deleteTodo;
    loadTodos();
  </script>
</body>
</html>
